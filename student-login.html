<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | SIWES</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-card">
    <img src="assets/siwes_logo.png" alt="SIWES Logo" class="logo-img"
         onerror="this.outerHTML='<div class=&quot;logo&quot;>ITF</div>'">

    <span class="portal-tag">Student Portal</span>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your SIWES logbook and messages</p>

    <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="Enter your email">
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password">
    </div>

    <button onclick="loginStudent()">Login</button>

    <p class="footnote">Don't have login details? Ask your school's SIWES coordinator.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/jsfirebase-config.js"></script>
<script src="js/student-auth.js"></script>
</body>
</html>
